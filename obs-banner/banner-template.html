<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComicRox OBS banner</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:Arial,Helvetica,sans-serif}#stage{position:absolute;transform-origin:top left;width:var(--w);height:var(--h);padding:10px 12px;isolation:isolate}.panel{position:absolute;inset:22px 15px 22px 67px;background:linear-gradient(115deg,#151a17,#070a08 65%);border:2px solid #5dff32;border-left:0;border-radius:16px 24px 24px 12px;box-shadow:0 0 18px #32ff2320,0 6px 12px #0008;overflow:hidden}.panel:before{content:'';position:absolute;inset:0;opacity:.18;background-image:radial-gradient(#71c77a 1px,transparent 1px);background-size:9px 9px;mask-image:linear-gradient(90deg,transparent 25%,#000)}.panel:after{content:'';position:absolute;right:0;top:0;width:100px;height:100%;background:repeating-linear-gradient(115deg,transparent 0 13px,#67ff3320 14px 20px);mask-image:linear-gradient(90deg,transparent,#000)}.logo{position:absolute;left:12px;top:10px;width:140px;height:140px;border-radius:50%;background:#000;overflow:hidden;border:2px solid #effff0;box-shadow:0 0 0 5px #070a08,0 0 0 6px #5dff32,0 3px 15px #000b;z-index:3}.logo img,.logo video{width:100%;height:100%;object-fit:contain;display:block}#content{position:absolute;left:176px;right:72px;top:35px;height:91px;overflow:hidden;z-index:2}.eyebrow{display:flex;align-items:center;gap:9px;color:#79ff50;font-size:13px;letter-spacing:3px;font-weight:800;height:18px}.eyebrow:before{content:'';display:block;width:6px;height:6px;background:#75ff43;border-radius:50%}#message{margin:9px 0 0;white-space:nowrap;font-size:39px;font-weight:900;font-style:italic;letter-spacing:-.6px;line-height:1.12;color:#fff;filter:drop-shadow(0 2px 0 #000);transform-origin:left center}#message.web{color:#7bff50;font-style:normal}.exit{animation:out .32s ease both}.enter{animation:in .5s cubic-bezier(.16,.8,.3,1) both}#progress{position:absolute;bottom:22px;left:177px;right:78px;height:3px;overflow:hidden;z-index:3;background:#5dff331c}#progress span{display:block;height:100%;background:linear-gradient(90deg,#13af54,#83ff35);transform-origin:left center}#marker{position:absolute;right:37px;top:68px;width:18px;height:18px;fill:#83ff35;z-index:2}@keyframes in{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}@keyframes out{to{opacity:0;transform:translateY(-24px)}}@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){.enter,.exit{animation:none}}
</style></head><body><main id="stage" aria-label="ComicRox promotional banner"><div class="panel"></div><div class="logo" id="logo"></div><div id="content"><div class="eyebrow" id="label"></div><div id="message" aria-live="polite"></div></div><svg id="marker" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 0 3.1 8.1L24 9l-6.8 5.7 2.2 9.3L12 19l-7.4 5 2.2-9.3L0 9l8.9-.9z"/></svg><div id="progress"><span></span></div></main><script>
const CONFIG=__CONFIG__;
(()=>{const stage=document.querySelector('#stage'),text=document.querySelector('#message'),label=document.querySelector('#label'),progress=document.querySelector('#progress span');let index=0;const wide=CONFIG.width>1000;stage.style.setProperty('--w',CONFIG.width+'px');stage.style.setProperty('--h',CONFIG.height+'px');if(wide){document.querySelector('#content').style.right='95px';text.style.fontSize='60px';document.querySelector('#content').style.top='40px';document.querySelector('#content').style.height='112px';document.querySelector('#marker').style.top='78px';document.querySelector('.logo').style.top='20px';}
const logo=document.createElement(CONFIG.animated?'video':'img');if(CONFIG.animated){logo.autoplay=true;logo.loop=true;logo.muted=true;logo.playsInline=true;logo.src=CONFIG.video;logo.setAttribute('aria-label','Animated ComicRox logo');}else{logo.src=CONFIG.image;logo.alt='ComicRox logo';}document.querySelector('#logo').append(logo);
function resize(){const scale=Math.min(innerWidth/CONFIG.width,innerHeight/CONFIG.height);stage.style.transform='scale('+scale+')';stage.style.left=((innerWidth-CONFIG.width*scale)/2)+'px';stage.style.top=((innerHeight-CONFIG.height*scale)/2)+'px';}addEventListener('resize',resize);resize();
function fit(){let size=wide?60:39;text.style.fontSize=size+'px';while(text.scrollWidth>text.clientWidth&&size>12){size--;text.style.fontSize=size+'px';}}
function show(){const item=CONFIG.messages[index];text.textContent=item.text;label.textContent=item.label||'COMIC ROX';text.className=(/comicrox\.co\.uk/i.test(item.text)?'web ':'')+'enter';fit();progress.style.animation='none';void progress.offsetWidth;progress.style.animation='fill '+CONFIG.seconds+'s linear both';}
show();setInterval(()=>{text.className='exit';setTimeout(()=>{index=(index+1)%CONFIG.messages.length;show();},330);},CONFIG.seconds*1000);
window.ComicRoxBanner={getIndex:()=>index,getConfig:()=>CONFIG};
})();
</script></body></html>
